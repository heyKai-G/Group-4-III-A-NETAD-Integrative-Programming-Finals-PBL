{% extends "base_auth.html" %}
{% block title %}Two-factor code{% endblock %}
{% block content %}
<h1 class="h4 mb-1">Two-factor authentication</h1>
<p class="text-secondary small">Enter the 6-digit code from your authenticator app.</p>
{% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-4"><label class="form-label" for="code">Code</label>
    <input class="form-control form-control-lg text-center code-input" id="code" name="code" inputmode="numeric"
           autocomplete="one-time-code" maxlength="7" required autofocus></div>
  <button class="btn btn-primary w-100">Verify and log in</button>
  <a class="d-block text-center mt-3 small" href="{{ url_for('auth.login') }}">Start over</a>
</form>
{% endblock %}
