{% extends "base.html" %}
{% block title %}Delete account{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6 col-xl-5">
<h1 class="h3 mb-3">Delete account</h1>
<div class="card border-danger"><div class="card-body">
  <p>You are about to delete the account <strong>{{ target.username }}</strong>. This cannot be undone. Confirm that it is really you:</p>
  {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
  <form method="post" novalidate autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="password">Your password</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="code">Your authenticator code</label>
      <input class="form-control code-input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required></div>
    <button class="btn btn-danger">Delete {{ target.username }}</button>
    <a class="btn btn-outline-secondary ms-2" href="{{ url_for('auth.users') }}">Cancel</a>
  </form>
</div></div>
</div></div>
{% endblock %}
